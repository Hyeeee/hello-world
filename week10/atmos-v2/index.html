<style>
/* ---- Atmos design tokens (v2) ---- */
:root{
  --text-xs:10px;  /* mono meta: city, time, counters */
  --text-sm:12px;  /* captions, buttons in toggles, tags */
  --text-md:14px;  /* body and UI text */
  --text-lg:16px;  /* section titles */
  --text-xl:18px;  /* people's words (serif) */
  --text-2xl:22px; /* brand, Korean question */
  --text-3xl:28px; /* the question (serif) */
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-pill:999px;
}


:root{
  --ground:#EDEDEB;
  --dots:rgba(17,17,17,.075);
  --ink:#111112;
  --ink-2:#55565B;
  --ink-3:#8C8D92;
  --line:rgba(17,17,18,.09);
  --line-2:rgba(17,17,18,.18);
  --glass:rgba(255,255,255,.58);
  --glass-2:rgba(255,255,255,.30);
  --glass-hi:rgba(255,255,255,.85);
  --glass-solid:rgba(250,250,249,.86);
  --glass-bar:rgba(237,237,235,.82);
  --err:#C8412F;
  --glass-brd:rgba(255,255,255,.75);
  --fill:rgba(17,17,18,.05);
  --shadow:0 18px 50px -30px rgba(0,0,0,.28);
  --on-ink:#FAFAF9;
  --font:'Geist','Noto Sans KR','Noto Sans SC','Apple SD Gothic Neo','PingFang SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --serif:'Instrument Serif','Gowun Batang','Noto Serif SC','AppleMyungjo','Songti SC',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0D0D0E; --dots:rgba(255,255,255,.06); --ink:#EDEDED; --ink-2:#A2A3A8; --ink-3:#6B6C71;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
    --glass:rgba(24,24,26,.55); --glass-2:rgba(24,24,26,.25); --glass-hi:rgba(255,255,255,.09); --glass-solid:rgba(26,26,28,.86); --glass-bar:rgba(13,13,14,.8); --err:#FF7A66;
    --glass-brd:rgba(255,255,255,.09); --fill:rgba(255,255,255,.06);
    --shadow:0 18px 50px -24px rgba(0,0,0,.8); --on-ink:#0D0D0E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0D0D0E; --dots:rgba(255,255,255,.06); --ink:#EDEDED; --ink-2:#A2A3A8; --ink-3:#6B6C71;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --glass:rgba(24,24,26,.55); --glass-2:rgba(24,24,26,.25); --glass-hi:rgba(255,255,255,.09); --glass-solid:rgba(26,26,28,.86); --glass-bar:rgba(13,13,14,.8); --err:#FF7A66;
  --glass-brd:rgba(255,255,255,.09); --fill:rgba(255,255,255,.06);
  --shadow:0 18px 50px -24px rgba(0,0,0,.8); --on-ink:#0D0D0E;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html[lang="ko"] body{word-break:keep-all;overflow-wrap:anywhere}
html.ko .phrase,html.ko .compose-q em,html.ko .journal::placeholder{font-style:normal}
html.ko .compose-q{font-size:var(--text-2xl);font-weight:500;letter-spacing:-.02em;line-height:1.25}
html.ko .ptext,html.ko .journal,html.ko .forb .tip p{font-size:var(--text-lg);letter-spacing:-.01em}
html.ko .phrase{font-size:var(--text-xl);font-weight:500;letter-spacing:-.02em}
html.ko .mono{letter-spacing:.02em}
html.ko .big{font-weight:300}
.big{margin-left:-.05em;transition:margin-left .6s cubic-bezier(.22,.9,.24,1)}
.big[data-first="1"]{margin-left:-.13em}
.big .dec{font-size:.5em;letter-spacing:-.02em;font-weight:500}
.big .dg{position:relative;display:inline-block;line-height:1.12em;letter-spacing:0;margin-right:-.068em;clip-path:inset(0 -.1em)}
.big .dg::before{content:'0';visibility:hidden}
.big .dg .st{position:absolute;left:0;right:0;top:0}
.big .dec .dg{margin-right:-.02em}
.big .st{display:flex;flex-direction:column;transition:transform .7s cubic-bezier(.22,.9,.24,1)}
.big .st>span{height:1.12em;line-height:1.12em;text-align:center}
.big.still .st{transition:none}
@media (prefers-reduced-motion:reduce){.big .st{transition:none}}
html,body{min-height:100%}
body{background-color:var(--ground);background-image:radial-gradient(var(--dots) 1px,transparent 1.2px);background-size:14px 14px;color:var(--ink);font-family:var(--font);font-size:var(--text-md);line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px;border-radius:var(--radius-sm)}
.mono{font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:14px;padding:14px 16px;box-sizing:border-box;width:100%}
@media (max-width:699px){
  /* phones: a solid-ish frosted bar so content doesn't show through the header while scrolling */
  .top{top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;margin-bottom:12px;
    background:var(--glass-bar);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border-bottom:1px solid var(--line)}
}
.top > *{flex-shrink:0}
.top .sp{flex:1 1 0;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-size:var(--text-2xl);font-weight:400;letter-spacing:-.02em}
.brand svg{width:24px;height:24px}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border-radius:var(--radius-pill);background:var(--fill);font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.chip .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.chip.live .dot{animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.seg{display:inline-flex;padding:2px;border-radius:var(--radius-md);gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg button:hover:not([aria-pressed="true"]){background:var(--fill)}
.stats{display:flex;align-items:center;height:36px;border-radius:var(--radius-md);padding:0 4px}
.stats .st{display:flex;align-items:baseline;gap:6px;padding:0 12px}
.stats .st + .st{border-left:1px solid var(--line-2)}
.stats b{font-weight:400;font-size:var(--text-md);letter-spacing:-.01em}
.stats,.stats .st,.brand{white-space:nowrap}
.stats{flex:none}
@media (max-width:640px){ .top{gap:10px} #langDD{display:none} .stats{height:40px} .stats .st{flex-direction:column;align-items:center;gap:1px;padding:0 8px;line-height:1.1} .stats .mono{font-size:var(--text-xs)} .stats b{font-size:var(--text-md)} }
@media (max-width:400px){ .brand{font-size:var(--text-xl);gap:6px} .brand svg{width:20px;height:20px} .top{gap:8px} .stats .st{padding:0 6px} .stats .mono{font-size:var(--text-xs);letter-spacing:.04em} }
.lang .dd-menu{min-width:170px}
.top .dd{position:relative}
.theme-btn{width:36px;height:36px;border-radius:var(--radius-md);display:grid;place-items:center}
.theme-btn svg{width:16px;height:16px}

/* layout */
.app{position:relative;z-index:1;display:grid;gap:16px;padding-inline:16px;padding-block:4px 32px;grid-template-columns:minmax(0,1fr);grid-template-areas:"s" "j"}
.stage{grid-area:s}.journal-side{grid-area:j}
.panel{border-radius:var(--radius-xl);overflow:hidden;min-width:0;position:relative}
.sec{position:relative;padding:20px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.seg button{white-space:nowrap}
.sec-h h2{margin:0;font-size:var(--text-lg);font-weight:500;letter-spacing:-.01em}
.stage-l{display:flex;flex-direction:column;min-width:0}
.stage-r{position:relative;height:440px;border-top:1px solid var(--line);overflow:hidden;contain:layout paint;isolation:isolate}
#field{will-change:contents}
.stage-r .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--glass-solid)}
.forb .g{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--glass-solid)!important}
/* phones & tablets: weather first, full width; the field gets most of the height */
.stage-r{height:clamp(460px, 72vh, 620px)}
@media (max-width:699px){
  .stage-r{height:clamp(600px, 88vh, 760px)}
  .f-bot{flex-direction:column;align-items:stretch;gap:8px}
  .f-bot .fbox{width:100%}
  .f-bot .seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .f-bot .seg button{width:100%;justify-content:center;text-align:center;padding-inline:0}
  .cap{max-width:none}
  .cap p{font-size:var(--text-sm)}
  .stage-l .sec{padding:16px}
  .big{font-size:clamp(76px,22vw,104px)}
  .wrow{padding:6px 0;gap:8px}
  .wrow .d{font-size:var(--text-sm)}
  .wrow svg{width:18px;height:18px}
  .hl{margin-top:12px}
  .unit-seg{margin-top:12px}
  .phrase{font-size:var(--text-xl);margin-top:10px}
}
@media (min-width:700px) and (max-width:1279px){
  /* hero and forecast side by side so the field isn't pushed down */
  .stage-l{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:stretch}
  .stage-l > .sec{border-top:0}
  .stage-l > .detail{border-left:1px solid var(--line)}
  .stage-l > .credit{grid-column:1 / -1}
  .stage-r{height:clamp(560px, 74vh, 780px)}
  .big{font-size:clamp(88px,10vw,116px)}
  .wrow{padding:6px 0}
}
@media (min-width:1280px){
  .journal-side #feed{max-height:none}
  .journal-side{position:sticky;top:76px;height:calc(100dvh - 92px);min-height:600px;display:flex;flex-direction:column}

}
@media (min-width:1280px){

/* detail dropdown */
.dd{position:relative}
.detail .sec-h{flex-wrap:nowrap}
.dd-btn{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:var(--radius-md);background:var(--fill);color:var(--ink-2);padding:0;transition:background .2s,color .2s}
.dd-btn:hover,.dd-btn[aria-expanded="true"]{background:var(--ink);color:var(--on-ink)}
.dd-btn svg{width:13px;height:13px;transition:transform .25s}
.dd-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.dd-menu{position:absolute;right:0;left:auto;top:calc(100% + 6px);z-index:20;min-width:220px;padding:4px;border-radius:var(--radius-lg);background:var(--ground)!important;display:flex;flex-direction:column;gap:2px;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.dd-menu button{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:transparent;border-radius:var(--radius-sm);padding:8px 10px;font-size:var(--text-md);text-align:left}
.dd-menu button:hover{background:var(--fill)}
.dd-menu button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.dd-menu button[aria-selected="true"] .mono{color:var(--on-ink);opacity:.6}
.view{animation:viewIn .35s ease}
.credit{margin:auto 22px 18px;padding-top:12px;text-transform:none;letter-spacing:.02em}
.credit a{color:inherit}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}}
.city-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.city-sel{position:relative;display:inline-flex;align-items:center}
.city-sel select{appearance:none;field-sizing:content;border:0;border-radius:var(--radius-md);background:transparent;font-size:var(--text-xl);font-weight:400;padding:2px 24px 2px 8px;margin-left:-8px;cursor:pointer;letter-spacing:-.01em}
.city-sel select option{color:#111}
.city-sel svg{position:absolute;right:8px;pointer-events:none;width:12px;height:12px}
.srcchip{margin-left:auto}
.hero-temp{display:flex;align-items:flex-start;gap:12px;margin-top:16px}
.big{font-family:'Pretendard Variable',Pretendard,Geist,'Noto Sans KR',system-ui,sans-serif;font-weight:300;font-size:clamp(92px,11vw,128px);line-height:.86;letter-spacing:-.068em;font-variant-numeric:tabular-nums}
.big sup{font-size:.34em;font-weight:500;vertical-align:top;position:relative;top:.12em;margin-left:.04em;letter-spacing:0}
.hero-side{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.cond{display:flex;align-items:center;gap:8px;font-size:var(--text-lg);line-height:1.2}
.cond svg{flex:none}
.hero-side{min-width:0}
.cond svg{width:26px;height:26px}
.hl{margin-top:16px;display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-2);font-size:var(--text-md)}
.hl b{font-weight:400;color:var(--ink)}
.hl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hl-row .hl{flex:1 1 auto}
.unit-seg{margin-top:16px;flex:none}
.unit-seg button{cursor:pointer}
.phrase{margin:14px 0 0;font-family:var(--serif);font-size:var(--text-2xl);line-height:1.25;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.dials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px 16px;min-width:0;text-align:center}
.dial:nth-child(2n){border-left:1px solid var(--line)}
.dial:nth-child(n+3){border-top:1px solid var(--line)}
.dial .dk{align-self:stretch;text-align:left;font-size:var(--text-sm);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.dial svg{width:64px;height:64px}
.dial .v{font-size:var(--text-2xl);font-weight:300;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.dial .ds{display:inline-flex;align-items:center;gap:6px;max-width:100%;font-size:var(--text-sm);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dial .ds::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--ink-2)}
.dial .v small{font-size:var(--text-sm);color:var(--ink-3);margin-left:2px;letter-spacing:0}

.wrow{display:grid;grid-template-columns:44px 24px 34px minmax(0,1fr) 34px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .d{font-size:var(--text-md)}
.wrow svg{width:20px;height:20px;color:var(--ink-2)}
.wrow .lo{color:var(--ink-3);text-align:right}
.range{position:relative;height:3px;border-radius:2px;background:var(--fill)}
.range i{position:absolute;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,var(--ink-3),var(--ink))}
.sun svg{width:100%;height:auto;display:block}
.sun-row{display:flex;justify-content:space-between;margin-top:2px;padding-inline:2px}

/* field */
#field{position:absolute;inset:0;width:100%;height:100%}
.f-top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;z-index:3}
.scrub{flex:1;display:flex;align-items:center;gap:8px;padding:6px;border-radius:var(--radius-lg);min-width:0}
.scrub .play,.scrub .now{border:0;background:var(--fill);height:34px;border-radius:var(--radius-md);display:grid;place-items:center;padding:0 12px;font-size:var(--text-sm);flex:none}
.scrub .play{width:34px;padding:0}
.scrub .play svg{width:12px;height:12px}
.track{position:relative;flex:1;height:34px;cursor:pointer;touch-action:none;min-width:0}
.track .tk{position:absolute;top:8px;width:1px;height:5px;transform:translateX(-50%);background:var(--line-2)}
.track .tk.maj{top:6px;height:9px;background:var(--ink-3)}
.track .lb{position:absolute;bottom:1px;transform:translateX(-50%);font-family:var(--mono);font-size:var(--text-xs);line-height:1;color:var(--ink-3);transition:color .2s}
.track .marker{position:absolute;top:5px;height:12px;width:3px;border-radius:2px;transform:translateX(-50%);background:var(--ink);transition:left .25s ease;box-shadow:0 0 0 2px var(--glass-solid)}
.track .nowdot{position:absolute;top:5px;width:6px;height:12px;border-radius:2px;transform:translateX(-50%);background:var(--on-ink);border:1.5px solid var(--ink);box-sizing:border-box}
.track .marker{z-index:1}
.readout{position:absolute;left:24px;top:72px;z-index:2;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.readout .rt{font-size:var(--text-3xl);font-weight:200;letter-spacing:-.03em}
.f-bot{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;z-index:3;flex-wrap:wrap}
.fbox{padding:8px 10px;border-radius:var(--radius-lg);display:flex;flex-direction:column;gap:6px}
.cap{max-width:300px}
/* when the field itself is narrow (phones, or a narrow column on desktop), stack the overlays full-width */
.stage-r{container-type:inline-size}
@container (max-width:620px){
  .f-bot{flex-direction:column;align-items:stretch;gap:8px}
  .f-bot .fbox{width:100%;box-sizing:border-box}
  .f-bot .seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .f-bot .seg button{width:100%;justify-content:center;text-align:center;padding-inline:0}
  .cap{max-width:none}
}
.cap p{margin:0;font-size:var(--text-sm);line-height:1.45;color:var(--ink-2);text-wrap:pretty}
.lg{margin-top:4px}
.lg-bar{position:relative;height:6px}
.lg-bar i{position:absolute;inset:0;border-radius:var(--radius-sm)}
.lg-bar b{position:absolute;top:50%;width:10px;height:10px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--ground);border:1.5px solid var(--ink);transition:left .3s}
.lg-t{display:flex;justify-content:space-between;margin-top:4px;font-size:var(--text-xs)}
#field{cursor:crosshair;touch-action:manipulation}
.orbs[hidden]{display:none}
.forb.flash .g{animation:flash .9s ease}
@keyframes flash{30%{transform:scale(1.45);background:var(--ink);color:var(--on-ink)}}
.loc{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--glass-2);color:var(--ink-2);padding:0}
.loc svg{width:14px;height:14px}
.loc[data-state="on"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.loc[data-state="loading"] svg{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orbs{position:absolute;inset:0;z-index:2;pointer-events:none}
.forb{position:absolute;will-change:transform,opacity;transition:opacity .2s;pointer-events:auto;border:0;padding:0;background:transparent;border-radius:50%;color:var(--ink)}
.forb .g{display:grid;place-items:center;border-radius:50%;background:var(--glass);border:1px solid var(--line-2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .25s}
.forb .g svg{width:70%;height:70%}
.forb::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--ink);opacity:0;animation:ring 4.5s ease-out infinite;animation-delay:var(--dl,0s)}
@keyframes ring{0%{transform:scale(.7);opacity:.35}100%{transform:scale(1.9);opacity:0}}
.forb:hover .g,.forb:focus-visible .g{transform:scale(1.2)}
.forb .tip{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%) translateY(4px);width:220px;padding:12px 14px;border-radius:var(--radius-lg);text-align:left;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-size:var(--text-sm)}
.forb:hover .tip,.forb:focus-visible .tip,.forb.open .tip{opacity:1;transform:translateX(-50%)}
.forb.open{z-index:3}
.fcl{position:absolute;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 4px;border-radius:var(--radius-pill);border:1px solid var(--line-2);background:var(--glass-solid);color:var(--ink);will-change:transform,opacity;transition:opacity .2s;box-shadow:0 4px 14px -8px rgba(0,0,0,.35)}
.fcl .fg{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--on-ink)}
.fcl .fg svg{width:70%;height:70%}
.fcl b{font-weight:500;font-size:var(--text-md);letter-spacing:-.01em}
.fcl:hover{border-color:var(--ink)}
.gback{position:absolute;left:12px;top:64px;z-index:4;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:var(--radius-md);font-size:var(--text-sm);border:1px solid var(--glass-brd)}
.gback svg{width:12px;height:12px}
.forb.open .g{background:var(--ink)!important;color:var(--on-ink)}
.forb .tip p{margin:4px 0 0;font-family:var(--serif);font-size:var(--text-lg);line-height:1.3}

/* mood glyphs */
.gl{display:grid;place-items:center;border-radius:50%;border:1px solid var(--line-2);color:var(--ink);background:var(--glass-2)}
.gl svg{width:72%;height:72%}

/* social */
.compose-q{margin:0 0 14px;font-family:var(--serif);font-size:var(--text-3xl);line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.compose-q em{font-style:italic}
.moods{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-bottom:14px}
.mood{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 6px;border:1px solid transparent;border-radius:var(--radius-lg);background:transparent}
.mood .gl{width:38px;height:38px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s}
.mood span{font-size:var(--text-sm);color:var(--ink-2)}
.mood:hover .gl{transform:scale(1.07)}
.mood[aria-checked="true"] .gl{background:var(--ink);color:var(--on-ink);border-color:var(--ink);transform:scale(1.1)}
.mood[aria-checked="true"] span{color:var(--ink)}
.inten{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.inten input{flex:1;accent-color:var(--ink)}
.nick-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nick-row label{flex:none}
#nick{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line-2);background:transparent;padding:4px 0;font-size:var(--text-md);outline:none;transition:border-color .2s}
#nick:focus{border-bottom:1px solid var(--ink)}
#nick::placeholder{color:var(--ink-3)}
.journal{width:100%;min-height:92px;max-height:320px;resize:none;overflow-y:hidden;display:block;transition:height .12s ease;border:1px solid var(--line-2);border-radius:var(--radius-lg);background:var(--glass-2);padding:12px 14px;font-family:var(--serif);font-size:var(--text-xl);line-height:1.4}
.journal::placeholder{color:var(--ink-3);font-style:italic}
.where{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:var(--text-sm);color:var(--ink-2);min-width:0}
.where svg{width:13px;height:13px;flex:none}
.where span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.where button{margin-left:auto;flex:none;border:0;background:transparent;padding:2px 0;font-size:var(--text-sm);color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.compose-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.vis{display:inline-flex;gap:2px;padding:2px;border-radius:var(--radius-md);background:var(--fill)}
.vis button{border:0;background:transparent;padding:4px 10px;border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--ink-2)}
.vis button[aria-pressed="true"]{background:var(--glass-hi);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{border:0;background:var(--ink);color:var(--on-ink);padding:10px 20px;border-radius:var(--radius-md);font-size:var(--text-md);font-weight:500;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.note{margin:10px 0 0;font-size:var(--text-sm);color:var(--ink-3)}
.note.err{color:var(--err);display:flex;align-items:center;gap:6px;animation:shake .35s ease}
.note.err::before{content:"!";flex:none;display:grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--err);color:#fff;font:600 10px/1 var(--font)}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.moods.invalid .gl{border-color:var(--err);border-style:dashed}
#nick.invalid{border-bottom-color:var(--err);border-bottom-style:solid}
.journal.invalid{border-color:var(--err)}

.summary{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.summary .gl{width:64px;height:64px}
.summary .dom{font-family:var(--serif);font-size:var(--text-3xl);line-height:1.05}
.stack{display:flex;height:6px;border-radius:var(--radius-sm);overflow:hidden;margin-top:14px;gap:2px}
.stack i{display:block;height:100%;background:var(--ink)}
.slist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;margin-top:12px}
.slist div{display:flex;align-items:center;gap:6px;font-size:var(--text-sm);color:var(--ink-2)}
.slist .sw{width:8px;height:8px;border-radius:2px;background:var(--ink)}
.slist b{font-weight:400;color:var(--ink);margin-left:auto}

.post{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:16px 0;border-top:1px solid var(--line);animation:rise .5s ease both}
.post:first-child{border-top:0;padding-top:4px}
@keyframes rise{from{transform:translateY(6px);opacity:.3}}
.post .gl{width:34px;height:34px;margin-top:2px}
.pmeta{display:flex;align-items:center;gap:8px;min-width:0}
.pmeta b{flex:none}
.pmeta .mono{text-transform:none;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--ink-2)}
.pmeta img{width:18px;height:18px;border-radius:50%;filter:grayscale(1)}
.pmeta b{font-weight:500;font-size:var(--text-md)}
.ptext{margin:6px 0 8px;font-family:var(--serif);font-size:var(--text-xl);line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap}
.pact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.metoo{border:1px solid var(--line-2);background:transparent;border-radius:var(--radius-pill);padding:4px 10px;font-size:var(--text-sm);display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);transition:background .2s}
.metoo[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.metoo:disabled{cursor:default;opacity:.55}
.trtog{border:0;background:transparent;padding:4px 2px;font-size:var(--text-sm);color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.del{border:0;background:transparent;font-size:var(--text-sm);color:var(--ink-3);padding:4px 6px;margin-left:auto}
.del.arm{color:var(--ink);text-decoration:underline}
.bars{display:inline-flex;gap:2px}
.bars i{width:4px;height:10px;border-radius:2px;background:var(--line-2)}
.bars i.on{background:var(--ink-2)}
.post.example{opacity:1}
.post.private .ptext{color:var(--ink-2)}
.empty{padding:16px 0 6px;color:var(--ink-3);font-size:var(--text-md)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;padding:10px 16px;border-radius:var(--radius-lg);font-size:var(--text-md)}

@media (max-width:520px){
  .top .date{display:none}
  .f-bot .fbox:first-child>.mono{display:none}
  .mood .gl{width:34px;height:34px}
  .mood span{font-size:var(--text-xs)}
}
@media (prefers-reduced-motion:reduce){
  .forb::before,.chip.live .dot,.post{animation:none}
  *{transition-duration:.01ms!important}
}

/* One toggle style everywhere: pressed = ink fill */
.vis{padding:4px;border-radius:var(--radius-md);background:var(--fill)}
.vis button{padding:6px 10px;border-radius:var(--radius-sm);font-size:var(--text-sm)}
.vis button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);box-shadow:none}
/* One input style: boxed */
#nick{border:1px solid var(--line-2);border-radius:var(--radius-md);background:var(--glass-2);padding:10px 14px}
#nick:focus{border:1px solid var(--ink)}
#nick.invalid{border-color:var(--err);border-style:solid}
.journal{border-radius:var(--radius-md)}
/* Mood names read the same in the picker and the feed */
/* keep Feels / High / Low on one line with the unit toggle */
.hl{gap:12px}
.pact .chip{font-family:var(--font);text-transform:none;letter-spacing:0;font-size:var(--text-sm)}

/* ---- Check-in, one step at a time (v2) ---- */
.steps{display:flex;gap:14px;margin:0 0 14px;padding:0;list-style:none;font-size:var(--text-sm);color:var(--ink-3)}
.steps li{display:flex;align-items:center;gap:6px;transition:color .3s}
.steps li i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);
  font-style:normal;font-family:var(--mono);font-size:var(--text-xs);transition:background .3s,color .3s,border-color .3s}
.steps li.now{color:var(--ink)}
.steps li.now i{border-color:var(--ink)}
.steps li.done i{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.steps .posted{color:var(--ink)}

.step:not(.on){display:none}
.step.on{animation:stepIn .45s cubic-bezier(.22,.9,.24,1) both}
@keyframes stepIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.step-3{margin-top:12px}

/* step 1: the moods are the invitation, so they are bigger and gently alive */
.compose[data-step="1"] .mood .gl{width:46px;height:46px}
.compose[data-step="1"] .mood span{font-size:var(--text-sm);color:var(--ink)}
.compose[data-step="1"] .mood .gl{animation:breathe 3.6s ease-in-out infinite;animation-delay:calc(var(--i) * .35s)}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

function wmo(code){

  if((code>=51&&code<=67)||(code>=80&&code<=82)) return 'rain';

}

const cache = {};
async function fetchLive(c){
  const hit = cache[c.id]; if(hit && Date.now()-hit.at < 15*60e3) return hit.W;
  const q = `latitude=${c.lat}&longitude=${c.lon}&timezone=${encodeURIComponent(c.tz)}&forecast_days=7`;
  const url = `https://api.open-meteo.com/v1/forecast?${q}&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,uv_index,precipitation,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset`;
  const res = await fetch(url, {signal: withTimeout(7000)});
  if(!res.ok) throw new Error('forecast '+res.status);
  const j = await res.json();
  let aqi = null;
  try{
    const ar = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${c.lat}&longitude=${c.lon}&timezone=${encodeURIComponent(c.tz)}&forecast_days=1&hourly=us_aqi`, {signal: withTimeout(5000)});
    if(ar.ok) aqi = (await ar.json()).hourly.us_aqi;

  const H = j.hourly, D = j.daily;
  const hours = [];
  for(let h=0;h<24;h++) hours.push({
    h, t:+H.temperature_2m[h].toFixed(1), feels:+H.apparent_temperature[h].toFixed(1), hum:Math.round(H.relative_humidity_2m[h]),
    cond:wmo(H.weather_code[h]), wind:Math.round(H.wind_speed_10m[h]), dir:H.wind_direction_10m[h]||0,

  });

    const hum = Math.max(10,Math.min(100, c.hum + 10*Math.cos((h-5)/24*TAU) + (cond==='rain'?10:0)));
    const wind = Math.max(1, c.wind + 5*Math.sin(h/24*TAU*1.3) + (cond==='storm'?10:0) + (r()-.5)*2);
    const uv = h>=6 && h<=18 ? Math.max(0, c.uv*Math.sin((h-6)/12*Math.PI)*(cond==='clear'?1:cond==='partly'?.8:.45)) : 0;
    hours.push({h, t:Math.round(t*10)/10, cond, hum:Math.round(hum), wind:Math.round(wind), dir:(c.dir+(r()-.5)*40+360)%360, uv:Math.round(uv), aqi:Math.round(c.aqi+(r()-.5)*10), feels:Math.round((t-wind/12)*10)/10,
      pr: cond==='storm' ? +(2+r()*4).toFixed(1) : cond==='rain' ? +(.3+r()*1.6).toFixed(1) : 0,
      pp: cond==='storm'||cond==='rain' ? Math.round(60+r()*35) : cond==='cloudy' ? Math.round(10+r()*20) : Math.round(r()*10)});
  }
  const week = c.week.map((cond,i)=>({cond,
    hi:Math.round(i===0?Math.max(...hours.map(x=>x.t)):c.base+c.amp+(r()-.5)*5-(cond==='rain'?2:0)),

  ctx.beginPath();

function ringPt(h, rr){ const {cx,cy}=geo(); const a=h/24*TAU-Math.PI/2; return [cx+Math.cos(a)*rr, cy+Math.sin(a)*rr]; }

function textLang(t){ if(/[\uAC00-\uD7A3]/.test(t)) return 'ko'; if(/[\u3040-\u30FF]/.test(t)) return 'ja'; if(/[\u4E00-\u9FFF]/.test(t)) return 'zh'; return /[A-Za-z]/.test(t) ? 'en' : null; }
const TR = new Map(), TRP = new Map(), TRQ = []; let trActive = 0, trOff = false;
const trKey = t => 'atmos.tr.' + LANG + '.' + strHash(t);
function trCached(t){ if(TR.has(t)) return TR.get(t); try{ const v = localStorage.getItem(trKey(t)); if(v){ TR.set(t,v); return v; } }catch(e){} return null; }
function trPump(){
  while(trActive < 2 && TRQ.length){
    const {t, from, res} = TRQ.shift(); trActive++;
    const to = LANG==='zh' ? 'zh-CN' : LANG;
    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${from}|${to}`, {signal: withTimeout(8000)})
      .then(r=>r.json()).then(j=>{
        if(j.quotaFinished || +j.responseStatus!==200){ if(+j.responseStatus===429) trOff = true; res(null); return; }
        const d = document.createElement('textarea'); d.innerHTML = String(j.responseData?.translatedText||''); const out = d.value.trim();
        if(!out || out.toLowerCase()===t.toLowerCase()){ res(null); return; }
        TR.set(t,out); try{ localStorage.setItem(trKey(t), out); }catch(e){} res(out);
      }).catch(()=>res(null)).finally(()=>{ trActive--; trPump(); });
  }
}
function translate(t){
  const from = textLang(t);
  if(!from || from===LANG || trOff) return Promise.resolve(null);
  const c = trCached(t); if(c) return Promise.resolve(c);
  if(TRP.has(t)) return TRP.get(t);
  const pr = new Promise(res=>{ TRQ.push({t, from, res}); trPump(); }); TRP.set(t, pr); return pr;
}
/* fills a text element with the translation when there is one, and returns a small "show original" toggle */
function bindTranslation(el, text){
  const from = textLang(text); el.textContent = text;
  if(!from || from===LANG) return null;
  let orig = false, tr = trCached(text);
  const tog = h('button',{className:'trtog',type:'button'}); tog.hidden = !tr;
  const paint = () => { el.textContent = (tr && !orig) ? tr : text; tog.textContent = orig ? L.showTranslation : L.showOriginal; };
  tog.addEventListener('click', e=>{ e.stopPropagation(); orig = !orig; paint(); });
  paint();
  if(!tr) translate(text).then(v=>{ if(v){ tr = v; tog.hidden = false; paint(); } });
  return tog;
}

function postLatLon(p){

  const deg = (a,b) => { const r=Math.PI/180, x=Math.sin(a[0]*r)*Math.sin(b[0]*r)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.cos((a[1]-b[1])*r); return Math.acos(Math.max(-1,Math.min(1,x)))/r; };

    let g = [...groups.values()].find(g=>deg(g.ll, ll) < 12);
    if(!g){ g = {ll, names:[], items:[], key:'g'+groups.size}; groups.set(g.key, g); }
    g.items.push(p); const nm = cityName(p); if(nm && !g.names.includes(nm)) g.names.push(nm);
  });
  groups.forEach(g=>{ g.name = g.names.length>2 ? `${g.names[0]} · ${g.names[1]} +${g.names.length-2}` : g.names.join(' · '); });
  const makeOrb = (p, lat, lon, extra) => {
    const hs = strHash(p.id), m = MOOD[p.mood] || MOOD.foggy;
    field.orbs.push({mood:m.id});
    const g = h('span',{className:'g',style:'width:26px;height:26px'}); g.innerHTML = glyph(m.id);
    const tip = h('span',{className:'tip glass'}, h('span',{className:'mono'}, `${p.nick ? p.nick+' · ' : ''}${cityName(p)} · ${ago(p.createdAt)}`), h('p',{}, ''));
    bindTranslation(tip.lastChild, p.text);
    const b = h('button',{className:'forb',type:'button',style:`left:0;top:0;opacity:0;--dl:${-(hs%4500)/1000}s`,'aria-label':`${m.en}: ${p.text}`}, g, tip);
    b.dataset.mood = m.id; b.dataset.lat = lat; b.dataset.lon = lon; Object.assign(b.dataset, extra||{});
    b.addEventListener('click', ev=>{ ev.stopPropagation(); const open = b.classList.contains('open');
      wrap.querySelectorAll('.forb.open').forEach(o=>o.classList.remove('open'));
      if(!open){ b.classList.add('open'); if(!b.dataset.key) flyTo(lat, lon); } });
    wrap.append(b);
  };
  for(const [key, g] of groups){
    const [lat, lon] = g.ll;
    if(g.items.length === 1){ makeOrb(g.items[0], lat, lon); continue; }
    // several entries in one place: a count bubble that opens into a ring
    const n = g.items.length, top = [...g.items].sort((a,b)=>b.createdAt-a.createdAt)[0], m = MOOD[top.mood] || MOOD.foggy;
    const c = h('button',{className:'fcl',type:'button',style:'left:0;top:0;opacity:0','aria-label':`${g.name}: ${L.entriesN(n)}`, title:`${g.name} · ${L.entriesN(n)}`},

/* place the user at lat/lon (from GPS, or approximately from their network when GPS isn't available) */
async function applyLoc(lat, lon, pre, approx, interactive){
  const btn = $('#locBtn');

    const nb = nearest(lat,lon).c;
    let tz = nb.tz; try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || nb.tz }catch(e){}
    LOC = {...nb, id:'here', lat:+lat.toFixed(3), lon:+lon.toFixed(3), tz, en:L.curLoc, region:L.nearYou};
    try{
      const r = pre ? null : await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=${LANG}`, {signal: withTimeout(5000)});
      if(pre || r.ok){ const j = pre || await r.json(); const name = j.city || j.locality; if(name){ LOC.en = String(name).slice(0,60); if(LANG==='en') LOC.enName = LOC.en; }
        LOC.region = (LANG==='en' ? [String(j.principalSubdivisionCode||'').split('-').pop(), j.countryCode] : [j.principalSubdivision, j.countryName]).filter(Boolean).join(' · ') || L.nearYou; }
    }catch(e){}
    if(LANG!=='en'){ try{ const r2 = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`, {signal: withTimeout(5000)}); if(r2.ok){ const j2 = await r2.json(); const n2 = j2.city || j2.locality; if(n2) LOC.enName = String(n2).slice(0,60); } }catch(e){} }
    addHereOption(); delete cache.here;
    S.city = 'here'; sel.value = 'here'; btn.dataset.state = approx ? '' : 'on'; LOC.approx = !!approx;
    if(!approx) try{ localStorage.setItem('atmos.city','here') }catch(e){}
    if(interactive && !approx) toast(L.locShowing(LOC.en));
    await loadCity(); renderSocial(); updateWhere(); return true;
}
async function ipLocate(){     // no GPS (declined, in-app browser, desktop): approximate from the network instead of guessing by time zone
  if(LOC && !LOC.approx) return false;
  try{
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=${LANG}`, {signal: withTimeout(6000)});
    if(!r.ok) return false; const j = await r.json();
    if(j.latitude == null || j.longitude == null || (!j.latitude && !j.longitude)) return false;
    return await applyLoc(+j.latitude, +j.longitude, j, true, false);
  }catch(e){ return false; }
}
function useLocation(interactive){ return new Promise(done => {
  const btn = $('#locBtn');
  if(!navigator.geolocation){ if(interactive) toast(L.locUnsupported); ipLocate().then(ok=>done(ok)); return; }
  btn.dataset.state = 'loading'; S.locTried = true;
  navigator.geolocation.getCurrentPosition(async pos => {
    done(await applyLoc(pos.coords.latitude, pos.coords.longitude, null, false, interactive));
  }, async err => {
    btn.dataset.state = S.city==='here' ? 'on' : '';
    if(err.code===1) S.locDenied = true;
    if(interactive) toast(err.code===1 ? L.locDenied : L.locFail);
    const ok = await ipLocate(); updateWhere(); done(ok);
  }, {timeout:10000, maximumAge:30*60e3});
}); }

async function rpc(fn, args){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify(args||{}), signal:withTimeout(10000)});

  return j;
}
function newDevice(){
  const rnd = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b=>b.toString(16).padStart(2,'0')).join(''); };
  const id = crypto.randomUUID ? crypto.randomUUID() : rnd(16).replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/,'$1-$2-$3-$4-$5');
  return {id, secret: rnd(24)};
}

/* ================= visitor stats =================
   One document per visitor in `visits/<id>`: {first, last:'YYYY-MM-DD', lastTs}.
   Dates are counted in New York time so "today" and "this week" mean the same for everyone.
   A visitor writes at most once per day, so refreshing never double-counts. */
const STATS_TZ = 'America/New_York';
function dayKey(d){ const p = new Intl.DateTimeFormat('en-CA',{timeZone:STATS_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d); return p; }
function weekStartKey(){
  const now = new Date(), wd = new Intl.DateTimeFormat('en-US',{timeZone:STATS_TZ,weekday:'short'}).format(now);
  const back = {Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[wd] ?? 0;
  return dayKey(new Date(now.getTime() - back*864e5));
}
async function trackVisits(){
  let vid = uid;
  if(!vid){ try{ vid = localStorage.getItem('atmos.vid'); if(!vid){ vid = 'b_' + Math.random().toString(36).slice(2,12) + Date.now().toString(36); localStorage.setItem('atmos.vid', vid); } }catch(e){ vid = null; } }
  const fmt = n => new Intl.NumberFormat(LOCALE).format(n);
  const box = $('#stats');
  db.collection('visits').limit(1000).onSnapshot(snap => {
    const today = dayKey(new Date()), wk = weekStartKey();
    let t=0, w=0; snap.docs.forEach(d => { const l = d.data().last || ''; if(l===today) t++; if(l>=wk) w++; });
    $('#stToday').textContent = fmt(t); $('#stWeek').textContent = fmt(w);
    $('#stAll').textContent = snap.size>=1000 ? '1,000+' : fmt(snap.size);
    box.hidden = false;
  }, () => {});
  if(!vid) return;
  try{
    const ref = db.doc('visits/' + vid.replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,190));
    const today = dayKey(new Date()), snap = await ref.get();
    if(!snap.exists) await ref.set({first:Date.now(), last:today, lastTs:Date.now()});
    else if(snap.data().last !== today) await ref.update({last:today, lastTs:Date.now()});
  }catch(e){}
}
})();

<script>
/* Atmos v2 · check-in one step at a time */
(() => {
  const T = {
    en: { steps: ['Mood', 'A line', 'Post'], posted: 'Posted. You can find it in the feed below.',
          ph: { radiant: 'What made today bright?', calm: 'What’s keeping things calm?', cozy: 'What feels warm today?',
                foggy: 'What feels a little blurry right now?', blue: 'What’s weighing on you today?', stormy: 'What’s stirring things up?' } },
    ko: { steps: ['기분', '한 줄', '기록'], posted: '기록했어요. 아래 피드에서 볼 수 있어요.',
          ph: { radiant: '오늘을 밝게 만든 건 뭐였어요?', calm: '무엇 덕분에 차분한가요?', cozy: '오늘 따뜻하게 느껴지는 건요?',
                foggy: '지금 흐릿하게 느껴지는 건 뭐예요?', blue: '오늘 마음에 걸리는 게 있나요?', stormy: '무엇이 마음을 흔들고 있나요?' } }
  };
  const lang = () => (document.documentElement.lang || 'en').slice(0, 2) === 'ko' ? 'ko' : (document.documentElement.lang || 'en').startsWith('zh') ? null : 'en';
  const compose = document.getElementById('compose');
  const moods = document.getElementById('moods');
  const jr = document.getElementById('journal');
  const s2 = document.getElementById('step2'), s3 = document.getElementById('step3');
  const stepsEl = document.getElementById('steps');
  let basePh = null, postedUntil = 0, last = '';

  moods.querySelectorAll('.mood').forEach((b, i) => b.style.setProperty('--i', i));

  function current() {
    const mood = moods.querySelector('.mood[aria-checked="true"]');
    if (!mood) return { step: 1, mood: null };
    if (!jr.value.trim()) return { step: 2, mood: mood.dataset.id };
    return { step: 3, mood: mood.dataset.id };
  }

  function render() {
    const { step, mood } = current();
    const L = T[lang()] || T.en;
    const key = step + '|' + mood + '|' + lang() + '|' + (Date.now() < postedUntil);
    if (key === last) return; last = key;

    compose.dataset.step = step;
    s2.classList.toggle('on', step >= 2);
    s3.classList.toggle('on', step >= 3);
    s2.inert = step < 2; s3.inert = step < 3;

    if (Date.now() < postedUntil && step === 1) {
      stepsEl.innerHTML = `<li class="posted">${L.posted}</li>`;
    } else {
      stepsEl.innerHTML = L.steps.map((t, i) =>
        `<li class="${i + 1 < step ? 'done' : i + 1 === step ? 'now' : ''}"><i>${i + 1 < step ? '✓' : i + 1}</i>${t}</li>`).join('');
    }

    // the placeholder asks about the mood you picked (zh keeps the original)
    if (basePh === null) basePh = jr.placeholder;
    jr.placeholder = (lang() && mood && T[lang()].ph[mood]) || basePh;
  }

  moods.addEventListener('click', e => {
    const b = e.target.closest('.mood'); if (!b) return;
    const wasStep1 = compose.dataset.step === '1';
    setTimeout(() => { render(); if (wasStep1 && !jr.value.trim()) jr.focus({ preventScroll: true }); }, 0);
  });
  jr.addEventListener('input', render);
  window.addEventListener('atmos:posted', () => { postedUntil = Date.now() + 5000; last = ''; render(); setTimeout(() => { last = ''; render(); }, 5100); });
  // language switches and restored drafts change things without events, so check gently
  new MutationObserver(() => { last = ''; render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang', 'class'] });
  render();
})();
</script>
